<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C&S Calculator">
<meta name="theme-color" content="#fafaf8">
<title>Inspection Calculator | Clark and Sons Home Inspections</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o1:#616601;--o2:#898D10;--og:linear-gradient(120deg,#616601,#898D10);--ink:#111214;--mute:#8b8e94;--line:#e2e2de;--bg:#fafaf8}
*{box-sizing:border-box;margin:0;padding:0}
a{color:inherit;text-decoration:none}
html,body{height:100%}
body{background:#ececE6;font:400 15px/1.4 "Inter Tight",system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.app{width:100%;max-width:460px;min-height:100%;background:var(--bg);padding:calc(18px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));position:relative}
@media (min-width:520px){body{align-items:center;padding:24px}.app{min-height:auto;border-radius:36px;box-shadow:0 40px 90px -40px rgba(0,0,0,.35);padding-bottom:96px}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.top img{height:34px;width:auto}
.top a{font-weight:600;font-size:14px;padding:9px 14px;border-radius:99px;background:#efefea}
.eb{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--o1)}
h1{font-size:30px;line-height:1.05;letter-spacing:-.04em;font-weight:600;margin:8px 0 16px}
.bar{display:flex;gap:6px;margin-bottom:16px}
.bar i{flex:1;height:4px;border-radius:4px;background:#e6e6e0;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--og);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.bar i.on b{transform:scaleX(1)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}
.lbl{font-size:13.5px;font-weight:600;color:#45484e}
.sq{font-size:13px;color:var(--mute);margin-top:4px}
.sq b{font-size:38px;color:var(--ink);letter-spacing:-.045em;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--o1),var(--o2) var(--p,25%),#e6e6e0 var(--p,25%));margin:22px 0 20px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--o1);box-shadow:0 6px 14px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:2.5px solid var(--o1)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:10px 16px;border-radius:99px;border:1px solid var(--line);font-size:14.5px;font-weight:500;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.3s;background:#fff}
.chip.on{background:var(--og);color:#fff;border-color:transparent}
.add{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:15px;border:1px solid var(--line);margin-bottom:8px;font-size:15px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.3s}
.add b{font-weight:600}
.add.on{border-color:var(--o1);background:#fbfbf3}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;margin-top:12px}
.tot span{font-size:13.5px;color:rgba(255,255,255,.65)}
.tot b{font-size:30px;letter-spacing:-.04em;font-weight:600;font-variant-numeric:tabular-nums}
.tot b.call{font-size:20px}
.send{display:flex;justify-content:center;align-items:center;width:100%;height:58px;margin-top:16px;border:0;border-radius:99px;background:var(--og);color:#fff;font-weight:600;font-size:17px;cursor:pointer;box-shadow:0 14px 28px -14px rgba(97,102,1,.8);transition:transform .2s}
.send:active{transform:scale(.97)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:436px;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;padding:7px;border-radius:22px;background:var(--ink);box-shadow:0 18px 36px -14px rgba(0,0,0,.5)}
.dock a{height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;background:rgba(255,255,255,.08)}
.dock a.o{background:var(--og)}
@media (min-width:520px){.dock{position:absolute;bottom:14px;width:calc(100% - 28px)}}
.info{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border-radius:15px;border:1.5px dashed #c9cbb0;background:#fbfbf3;cursor:pointer;text-align:left;font:inherit;color:inherit}
.info .ic{width:36px;height:36px;border-radius:11px;background:var(--og);display:grid;place-items:center;flex:none}
.info .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.info b{display:block;font-size:15px;font-weight:600}
.info small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.info.set{border-style:solid;border-color:var(--o1)}
.info .ed{margin-left:auto;font-size:13px;font-weight:600;color:var(--o1)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,18,20,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.sheet.open{opacity:1;pointer-events:auto}
.sh{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .5s cubic-bezier(.22,1,.36,1)}
.sheet.open .sh{transform:none}
@media (min-width:520px){.sheet{align-items:center}.sh{border-radius:28px}}
.grab{width:44px;height:5px;border-radius:5px;background:#d6d6cf;margin:0 auto 14px}
.sh h2{font-size:22px;letter-spacing:-.03em;font-weight:600;margin-bottom:4px}
.sh p{font-size:13.5px;color:var(--mute);margin-bottom:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g .full{grid-column:1/-1}
.f{position:relative}
.f input,.f textarea{width:100%;height:56px;padding:22px 14px 6px;border-radius:13px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;outline:none;transition:border-color .3s,box-shadow .3s}
.f textarea{height:84px;padding-top:26px;resize:none}
.f label{position:absolute;left:15px;top:18px;font-size:15px;color:var(--mute);pointer-events:none;transition:.25s}
.f input:focus,.f textarea:focus{border-color:var(--o1);box-shadow:0 0 0 4px rgba(137,141,16,.15)}
.f input:focus+label,.f input:not(:placeholder-shown)+label,.f textarea:focus+label,.f textarea:not(:placeholder-shown)+label,.f input[type=date]+label{top:7px;font-size:11px;font-weight:600}
.f.err input{border-color:#c0392b}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--o1);margin:16px 0 8px}
.save{width:100%;height:56px;margin-top:16px;border:0;border-radius:99px;background:var(--og);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.clr{display:block;margin:12px auto 0;background:none;border:0;font:inherit;font-size:13.5px;color:var(--mute);text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:30;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.toast.show{transform:translate(-50%,0)}
@media (max-width:380px){.g{grid-template-columns:1fr}}
</style></head>

    <a class="o" href="#" id="order">Order</a>
  </nav>
</main>

<div class="sheet" id="sheet"><div class="sh">
  <div class="grab"></div>
  <h2>Your info</h2><p>Saved on this phone, so it's ready every time you order.</p>
  <div class="sec" style="margin-top:0">Client</div>
  <div class="g">
    <div class="f full"><input id="i_name" placeholder=" " autocomplete="name"><label for="i_name">Full name *</label></div>
    <div class="f"><input id="i_phone" type="tel" placeholder=" " autocomplete="tel"><label for="i_phone">Phone *</label></div>
    <div class="f"><input id="i_email" type="email" placeholder=" " autocomplete="email"><label for="i_email">Email</label></div>
  </div>
  <div class="sec">Property</div>
  <div class="g">
    <div class="f full"><input id="i_addr" placeholder=" " autocomplete="street-address"><label for="i_addr">Property address *</label></div>
    <div class="f"><input id="i_date" type="date" placeholder=" "><label for="i_date">Preferred date</label></div>
    <div class="f"><input id="i_access" placeholder=" "><label for="i_access">Lockbox / gate code</label></div>
  </div>
  <div class="sec">Agent</div>
  <div class="g">
    <div class="f"><input id="i_agent" placeholder=" "><label for="i_agent">Agent name</label></div>
    <div class="f"><input id="i_aphone" type="tel" placeholder=" "><label for="i_aphone">Agent phone</label></div>
    <div class="f full"><input id="i_aemail" type="email" placeholder=" "><label for="i_aemail">Agent email</label></div>
    <div class="f full"><textarea id="i_notes" placeholder=" "></textarea><label for="i_notes">Notes</label></div>
  </div>
  <button type="button" class="save" id="saveInfo">Save Info</button>
  <button type="button" class="clr" id="clrInfo">Clear saved info</button>
</div></div>
<div class="toast" id="toast">Saved ✓</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const T=[[1500,350],[2000,400],[2500,450],[3000,475],[3500,500],[4000,525],[4500,550],[5000,575]];
const sq=$('#sq'),tot=$('#tot');let shown=400,raf;
function calc(){
  const v=+sq.value;sq.style.setProperty('--p',((v-500)/5500*100)+'%');
  $('#sqv').textContent=v>=6000?'6,000+':v.toLocaleString();
  const t=T.find(x=>v<=x[0]);
  const on=$$('.add.on');$$('.bar i')[2].classList.toggle('on',on.length>0);
  if(!t){tot.className='call';tot.textContent='Call for price';return null;}
  const target=t[1]+on.reduce((s,a)=>s+ +a.dataset.p,0);
  tot.className='';cancelAnimationFrame(raf);const from=shown,st=performance.now();
  (function step(n){const k=Math.min(1,(n-st)/400),e=1-Math.pow(1-k,3);shown=Math.round(from+(target-from)*e);tot.textContent='$'+shown;if(k<1)raf=requestAnimationFrame(step);})(st);
  return target;
}
sq.addEventListener('input',calc);
$$('.add').forEach(a=>a.addEventListener('click',()=>{a.classList.toggle('on');calc();}));
$$('#type .chip').forEach(c=>c.addEventListener('click',()=>{$$('#type .chip').forEach(x=>x.classList.toggle('on',x===c));$$('.bar i')[3].classList.add('on');}));
const F=['name','phone','email','addr','date','access','agent','aphone','aemail','notes'];
const KEY='cs_calc_info';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
let info=load();
function paint(){
  const set=info.name||info.addr;
  $('#info').classList.toggle('set',!!set);
  $('#infoT').textContent=set?(info.name||'Your info'):'Add your info';
  $('#infoS').textContent=set?[info.addr,info.agent&&('Agent: '+info.agent)].filter(Boolean).join(' · ')||info.phone||'':'Name, phone, address & agent — saved for next time';
  $('#infoE').textContent=set?'Edit':'Add';
}
const sheet=$('#sheet');
function openSheet(){F.forEach(k=>{$('#i_'+k).value=info[k]||''});sheet.classList.add('open');}
const closeSheet=()=>sheet.classList.remove('open');
$('#info').addEventListener('click',openSheet);
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
$('#saveInfo').addEventListener('click',()=>{
  let ok=true;['name','phone','addr'].forEach(k=>{const i=$('#i_'+k),bad=!i.value.trim();i.parentElement.classList.toggle('err',bad);if(bad&&ok){i.focus();ok=false;}});
  if(!ok)return;
  F.forEach(k=>info[k]=$('#i_'+k).value.trim());
  try{localStorage.setItem(KEY,JSON.stringify(info))}catch(e){}
  paint();closeSheet();toast('Info saved ✓');
});
$('#clrInfo').addEventListener('click',()=>{info={};try{localStorage.removeItem(KEY)}catch(e){};F.forEach(k=>$('#i_'+k).value='');paint();toast('Cleared');});
$$('.sh input').forEach(i=>i.addEventListener('input',()=>i.parentElement.classList.remove('err')));
function send(e){e&&e.preventDefault();
  if(!info.name||!info.phone||!info.addr){openSheet();toast('Add your info first');return;}
  const v=+sq.value,t=T.find(x=>v<=x[0]),adds=$$('.add.on').map(a=>a.dataset.k);
  const total=t?'$'+(t[1]+$$('.add.on').reduce((s,a)=>s+ +a.dataset.p,0)):'Call for price';
  const dt=info.date?new Date(info.date+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'Flexible';
  const L=['INSPECTION ORDER','',
    'ESTIMATE','Square footage: '+(v>=6000?'6,000+':v.toLocaleString()),'Inspection: '+$('#type .chip.on').textContent,'Add-ons: '+(adds.join(', ')||'None'),'Estimated total: '+total,'',
    'CLIENT','Name: '+info.name,'Phone: '+info.phone,info.email&&('Email: '+info.email),'',
    'PROPERTY','Address: '+info.addr,'Preferred date: '+dt,info.access&&('Lockbox / gate: '+info.access),'',
    (info.agent||info.aphone||info.aemail)&&'AGENT',info.agent&&('Name: '+info.agent),info.aphone&&('Phone: '+info.aphone),info.aemail&&('Email: '+info.aemail),
    info.notes&&'',info.notes&&('Notes: '+info.notes)].filter(x=>x!==undefined&&x!==false&&x!==null);
  location.href='mailto:Clarkandsonsinfo@gmail.com'+(info.aemail?'?cc='+encodeURIComponent(info.aemail)+'&':'?')+'subject='+encodeURIComponent('Inspection Order — '+info.addr+' — '+total)+'&body='+encodeURIComponent(L.join('\n'));
}
paint();
$('#send').addEventListener('click',send);$('#order').addEventListener('click',send);
calc();
</script>
</body></html>
